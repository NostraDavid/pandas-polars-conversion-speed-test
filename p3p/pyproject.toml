[project]
name = "p3p"
version = "0.1.0"
description = "Run the shared conversion benchmark with pandas 3"
readme = "README.md"
authors = [
    { name = "NostraDavid", email = "55331731+NostraDavid@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "conversion-benchmark",
    "pandas>=3.1.0,<4", # Compare pandas 3 separately.
]

[tool.uv.sources]
conversion-benchmark = { path = "../benchmark", editable = true }

[project.scripts]
p3p = "p3p:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
