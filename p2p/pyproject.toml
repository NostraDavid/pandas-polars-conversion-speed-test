[project]
name = "p2p"
version = "0.1.0"
description = "Run the shared conversion benchmark with pandas 2"
readme = "README.md"
authors = [
    { name = "NostraDavid", email = "55331731+NostraDavid@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "conversion-benchmark",
    "pandas==2.3.3", # latest version of pandas 2.x
]

[tool.uv.sources]
conversion-benchmark = { path = "../benchmark", editable = true }

[project.scripts]
p2p = "p2p:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
